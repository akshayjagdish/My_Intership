services:
  erp:
    build: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      ERP_JWT_SECRET: ${ERP_JWT_SECRET:-change-me}
      ERP_DATA_FILE: /app/data/erp-db.json
      ERP_AUDIT_FILE: /app/logs/audit.log
    volumes:
      - erp-data:/app/data
      - erp-logs:/app/logs
    restart: unless-stopped

volumes:
  erp-data:
  erp-logs:
